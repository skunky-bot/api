name: API CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite:///./ci-test.db
      SECRET_KEY: ci-only-not-a-production-signing-key-use-unique-credentials
      BOOTSTRAP_ADMIN_USERNAME: ci_admin
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-strong-test-password-change-in-production
      BOOTSTRAP_ADMIN_EMAIL: ci-admin@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Run API tests
        run: python -m pytest -q
