name: Guarded native PR auto-merge

# No PR code is checked out or executed by this privileged workflow.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required test check is enforced
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not activate auto-merge if branch protection is missing, unreadable,
          # or the required API CI check has not been configured.
          # Rulesets and classic branch protection have different API endpoints.
          # Require an active ruleset matching the base branch and an explicit
          # required `test` check; fail closed otherwise.
          rulesets="$(gh api --paginate "repos/$REPO/rulesets")"
          ids="$(echo "$rulesets" | jq -r '.[] | select(.enforcement=="active" and .target=="branch") | .id')"
          valid=false
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            rule="$(gh api "repos/$REPO/rulesets/$id")"
            if echo "$rule" | jq -e --arg branch "refs/heads/$BASE" '
              (.conditions.ref_name.include // [] | index($branch) != null or index("~DEFAULT_BRANCH") != null)
              and
              ([.rules[] | select(.type=="required_status_checks") | .parameters.required_status_checks[]?.context] | index("test") != null)
              and
              ([.rules[] | select(.type=="pull_request")] | length > 0)
            ' >/dev/null; then
              valid=true
              break
            fi
          done <<< "$ids"
          [ "$valid" = true ]
      - name: Request GitHub native auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # GitHub enforces all branch-protection checks, reviews and rules.
          # Repository setting "Allow auto-merge" must also be enabled.
          gh pr merge "$NUMBER" --repo "$REPO" --auto --squash --delete-branch
